
name: Build FilzaJailedDS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Filza source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p theos/sdks
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/ios-sdk.tar.xz" \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/ios-sdk.tar.xz" \
            -C theos/sdks
          ls -la theos/sdks

      - name: Build dylib
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          xcodebuild -version

          make \
            TARGET=iphone:clang:16.5:15.0 \
            ARCHS="arm64 arm64e" \
            -j2

          mkdir -p build-output
          DYLIB=$(find .theos -type f \
            -name "FilzaApplySandboxExt.dylib" \
            -print -quit)

          test -n "$DYLIB"
          cp "$DYLIB" build-output/

          xcrun lipo -info \
            build-output/FilzaApplySandboxExt.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FilzaApplySandboxExt
          path: build-output/FilzaApplySandboxExt.dylib
          if-no-files-found: error
          retention-days: 7
